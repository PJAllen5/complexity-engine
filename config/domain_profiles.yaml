physiology:
  name: physiology
  description: Physiological and behavioral time-series analysis focused on variability, stress response, and temporal structure.
  analysis_question: How do changes in physiological signal dynamics relate to condition-specific stress, arousal, or variability?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  expected_columns:
    - signal
    - condition
    - subject_id
  signal_roles:
    primary_signal: Main physiological signal being assessed.
    condition: Experimental or task condition used for comparison.
    covariate: Optional metadata such as age, group, session, or clinical variables.
  interpretation_rules:
    sample_entropy: Higher sample entropy indicates reduced short-term predictability in the signal. Physiological regulation is classically understood as a cybernetic feedback process (Wiener, 1948; Ashby, 1956); a healthy regulatory system maintains a flexible operating range, so both unusually low entropy (rigid, overly constrained dynamics) and unusually high entropy (loss of regulatory control) can indicate impaired adaptability rather than simply "more" or "less" complexity.
    spectral_entropy: A more evenly distributed frequency spectrum means the signal is not dominated by one oscillatory rhythm. In feedback-control terms (Ashby, 1956), effective regulation typically distributes activity across several feedback timescales rather than a single dominant one, so a narrowing spectrum can reflect a collapse toward fewer active regulatory pathways.
    dfa_exponent: The DFA exponent estimates long-range temporal correlation. Values that depart from the uncorrelated random-walk baseline (~0.5) suggest history-dependent, self-organized fluctuation patterns rather than memoryless noise (Bak, 1996); interpret shifts relative to a subject's own baseline rather than the absolute value alone, since scale-free fluctuation patterns are common in healthy physiological systems.
    mutual_information: Mutual information between physiological signals reflects how tightly two subsystems are coupled through shared regulatory feedback (Ashby, 1956; Wiener, 1948); rising coupling under a condition can indicate coordinated regulation, while falling coupling can indicate the subsystems regulating more independently.

cognitive:
  name: cognitive
  description: Cognitive and neural time-series analysis focused on signal organization, predictability, and dynamic adjustment to task demands.
  analysis_question: Do cognitive or neural dynamics shift toward tighter predictive control, more distributed processing, or stronger temporal structure under task demands?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  expected_columns:
    - signal
    - condition
    - trial
  signal_roles:
    primary_signal: Main cognitive or neural signal being analyzed.
    condition: Condition, task state, or group labeling used for comparison.
    covariate: Optional covariates such as trial, session, or participant metadata.
  interpretation_rules:
    sample_entropy: Under a predictive-processing account, a well-tuned cognitive system minimizes surprise through precise, expected dynamics (Friston, 2010; Clark, 2013); falling entropy under task engagement can reflect tighter predictive control rather than "less complexity," while rising entropy can reflect exploration, uncertainty, or reduced model precision.
    spectral_entropy: Power distributed across more frequencies suggests multiple processing rhythms are active in parallel, consistent with connectionist accounts of distributed processing (Rumelhart et al., 1986); read this as evidence about how many concurrent processes are engaged, not as a direct measure of cognitive "complexity."
    dfa_exponent: Long-range correlation in cognitive or neural signals reflects memory-dependent dynamics rather than momentary reactivity (Hopfield, 1982; Rumelhart et al., 1986); a shift toward stronger persistence is more consistent with the system settling into a constrained, attractor-like processing mode than with becoming more "flexible."
    mutual_information: Mutual information across cognitive or neural signals indexes functional integration between distributed processing streams (Rumelhart et al., 1986); increasing coupling under task demands is consistent with binding separate processes into a coordinated response, while decreasing coupling suggests more independent, modular processing.

stress:
  name: stress
  description: Stress-monitoring profile for physiological time-series and task-induced variation.
  analysis_question: Does the monitored signal show a shift in regulatory range consistent with an allostatic stress response, or a failure to modulate that range?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  expected_columns:
    - signal
    - condition
    - subject_id
  signal_roles:
    primary_signal: Main physiological signal used to estimate stress-related dynamics.
    condition: Task or context label used to compare stress and baseline states.
    covariate: Optional metadata such as participant, session, or clinical notes.
  interpretation_rules:
    sample_entropy: Allostatic accounts of stress treat a healthy system as one that can modulate its regulatory range on demand (Wiener, 1948); a rise in entropy from a tightly regulated baseline is consistent with a shift into a more reactive state, while a baseline that fails to show this contrast may indicate reduced regulatory flexibility rather than resilience.
    spectral_entropy: Broader frequency dispersion under stress-related conditions is consistent with the recruitment of additional physiological subsystems (Ashby, 1956); a narrow, single-rhythm spectrum at baseline that persists under stress may indicate the system is not adaptively engaging alternate regulatory pathways.
    dfa_exponent: Shifts in the DFA exponent away from a subject's own baseline reflect changes in how history-dependent the signal's fluctuations are (Bak, 1996; Jensen, 2007); treat this as a marker of altered regulatory dynamics under stress, not as a direct measure of how "complex" or "healthy" the system is.
    mutual_information: Under an allostatic framing, physiological subsystems that recruit together under stress should show increased mutual information as they come under shared regulatory control (Wiener, 1948); persistently low coupling across conditions may indicate the signals are not part of the same stress-response pathway.

attention:
  name: attention
  description: Cognitive attention profile for task-driven dynamics and adaptive control.
  analysis_question: Does the monitored signal show tighter predictive precision when attention is engaged by the task, or reduced top-down control?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  expected_columns:
    - signal
    - condition
    - trial
  signal_roles:
    primary_signal: Main cognitive or neural signal associated with attentional state.
    condition: Task phase, condition, or experimental state used for comparison.
    covariate: Optional trial-level, session-level, or participant metadata.
  interpretation_rules:
    sample_entropy: Attention can be framed as precision-weighting of expected sensory or task-relevant signals (Friston, 2010; Clark, 2013; Hohwy, 2013); reduced entropy when attention is engaged is consistent with tighter predictive precision around the task, while elevated entropy may reflect divided attention or reduced top-down control rather than richer processing.
    spectral_entropy: A shift toward broader frequency engagement when attention is recruited is consistent with multiple task-relevant processes being active concurrently (Rumelhart et al., 1986); a narrower spectrum can indicate a single dominant rhythm capturing the bulk of signal energy.
    dfa_exponent: Changes in long-range temporal correlation during attentional engagement point to shifts in how strongly past states constrain present ones (Hopfield, 1982); stronger persistence is consistent with sustained, attractor-like engagement, while a drop toward random-walk-like behavior (~0.5) suggests more moment-to-moment reactivity.
    mutual_information: Under a predictive-processing account, attention coordinates precision-weighting across signals (Friston, 2010); increased mutual information when attention is engaged is consistent with shared top-down control linking the signals, while decreased coupling suggests they are being processed more independently.

network:
  name: network
  description: Network-science analysis of graph-structured data, focused on small-world structure, community organization, and connectivity.
  analysis_question: Does the network show small-world organization, distinct community structure, or scale-free connectivity, and how does that structure shift between conditions?
  recommended_metrics:
    - density
    - mean_degree
    - avg_clustering
    - transitivity
    - modularity
    - avg_shortest_path_length
  expected_columns:
    - source
    - target
    - condition
  signal_roles:
    source: One endpoint of each edge (a node identifier).
    target: The other endpoint of each edge (a node identifier).
    weight: Optional edge weight; used for clustering and modularity, but not for shortest-path distance.
    condition: Experimental or task condition used to compare network structure across states.
  interpretation_rules:
    avg_clustering: High average clustering means a node's neighbors tend to also be connected to each other, forming locally dense neighborhoods; this is one of the two defining ingredients of small-world structure (Watts & Strogatz, 1998).
    avg_shortest_path_length: A short average path length despite high clustering is the hallmark of small-world structure (Watts & Strogatz, 1998), combining locally dense neighborhoods with efficient global reach. A short path length alongside low clustering instead suggests a more random or centralized structure rather than a small-world one.
    transitivity: Transitivity is the network-wide version of clustering (the fraction of connected triples that close into a triangle); comparing it against average clustering shows whether local density is spread evenly or concentrated in a few well-connected nodes (Newman, 2010).
    modularity: High modularity indicates the network decomposes into distinct communities with denser connections inside each community than between them (Newman, 2010), consistent with functional specialization or subgroup structure; low modularity suggests a more globally integrated network without clear subgroup boundaries.
    density: Density is the fraction of all possible edges that are actually present; sparse, structured networks with high clustering are more consistent with small-world or scale-free organization than with a dense, unstructured network (Barabási & Albert, 1999).
    mean_degree: A network dominated by a few very high-degree hub nodes rather than a roughly uniform degree is the signature of scale-free, preferential-attachment growth (Barabási & Albert, 1999) rather than a random or regular network; this summary reports the mean only, so check the degree-distribution plot for whether a few hubs dominate.
