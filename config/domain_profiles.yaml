physiology:
  name: physiology
  description: Physiological and behavioral time-series analysis focused on variability, stress response, and temporal structure.
  analysis_question: How do changes in physiological signal dynamics relate to condition-specific stress, arousal, or variability?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  expected_columns:
    - signal
    - condition
    - subject_id
  signal_roles:
    primary_signal: Main physiological signal being assessed.
    condition: Experimental or task condition used for comparison.
    covariate: Optional metadata such as age, group, session, or clinical variables.
  interpretation_rules:
    sample_entropy: Higher sample entropy indicates reduced short-term predictability in the signal. Physiological regulation is classically understood as a cybernetic feedback process (Wiener, 1948; Ashby, 1956); a healthy regulatory system maintains a flexible operating range, so both unusually low entropy (rigid, overly constrained dynamics) and unusually high entropy (loss of regulatory control) can indicate impaired adaptability rather than simply "more" or "less" complexity.
    spectral_entropy: A more evenly distributed frequency spectrum means the signal is not dominated by one oscillatory rhythm. In feedback-control terms (Ashby, 1956), effective regulation typically distributes activity across several feedback timescales rather than a single dominant one, so a narrowing spectrum can reflect a collapse toward fewer active regulatory pathways.
    dfa_exponent: The DFA exponent estimates long-range temporal correlation. Values that depart from the uncorrelated random-walk baseline (~0.5) suggest history-dependent, self-organized fluctuation patterns rather than memoryless noise (Bak, 1996); interpret shifts relative to a subject's own baseline rather than the absolute value alone, since scale-free fluctuation patterns are common in healthy physiological systems.
    mutual_information: Mutual information between physiological signals reflects how tightly two subsystems are coupled through shared regulatory feedback (Ashby, 1956; Wiener, 1948); rising coupling under a condition can indicate coordinated regulation, while falling coupling can indicate the subsystems regulating more independently.

cognitive:
  name: cognitive
  description: Cognitive and neural time-series analysis focused on signal organization, predictability, and dynamic adjustment to task demands.
  analysis_question: Do cognitive or neural dynamics shift toward tighter predictive control, more distributed processing, or stronger temporal structure under task demands?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  expected_columns:
    - signal
    - condition
    - trial
  signal_roles:
    primary_signal: Main cognitive or neural signal being analyzed.
    condition: Condition, task state, or group labeling used for comparison.
    covariate: Optional covariates such as trial, session, or participant metadata.
  interpretation_rules:
    sample_entropy: Under a predictive-processing account, a well-tuned cognitive system minimizes surprise through precise, expected dynamics (Friston, 2010; Clark, 2013); falling entropy under task engagement can reflect tighter predictive control rather than "less complexity," while rising entropy can reflect exploration, uncertainty, or reduced model precision.
    spectral_entropy: Power distributed across more frequencies suggests multiple processing rhythms are active in parallel, consistent with connectionist accounts of distributed processing (Rumelhart et al., 1986); read this as evidence about how many concurrent processes are engaged, not as a direct measure of cognitive "complexity."
    dfa_exponent: Long-range correlation in cognitive or neural signals reflects memory-dependent dynamics rather than momentary reactivity (Hopfield, 1982; Rumelhart et al., 1986); a shift toward stronger persistence is more consistent with the system settling into a constrained, attractor-like processing mode than with becoming more "flexible."
    mutual_information: Mutual information across cognitive or neural signals indexes functional integration between distributed processing streams (Rumelhart et al., 1986); increasing coupling under task demands is consistent with binding separate processes into a coordinated response, while decreasing coupling suggests more independent, modular processing.

stress:
  name: stress
  description: Stress-monitoring profile for physiological time-series and task-induced variation.
  analysis_question: Does the monitored signal show a shift in regulatory range consistent with an allostatic stress response, or a failure to modulate that range?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  expected_columns:
    - signal
    - condition
    - subject_id
  signal_roles:
    primary_signal: Main physiological signal used to estimate stress-related dynamics.
    condition: Task or context label used to compare stress and baseline states.
    covariate: Optional metadata such as participant, session, or clinical notes.
  interpretation_rules:
    sample_entropy: Allostatic accounts of stress treat a healthy system as one that can modulate its regulatory range on demand (Wiener, 1948); a rise in entropy from a tightly regulated baseline is consistent with a shift into a more reactive state, while a baseline that fails to show this contrast may indicate reduced regulatory flexibility rather than resilience.
    spectral_entropy: Broader frequency dispersion under stress-related conditions is consistent with the recruitment of additional physiological subsystems (Ashby, 1956); a narrow, single-rhythm spectrum at baseline that persists under stress may indicate the system is not adaptively engaging alternate regulatory pathways.
    dfa_exponent: Shifts in the DFA exponent away from a subject's own baseline reflect changes in how history-dependent the signal's fluctuations are (Bak, 1996; Jensen, 2007); treat this as a marker of altered regulatory dynamics under stress, not as a direct measure of how "complex" or "healthy" the system is.
    mutual_information: Under an allostatic framing, physiological subsystems that recruit together under stress should show increased mutual information as they come under shared regulatory control (Wiener, 1948); persistently low coupling across conditions may indicate the signals are not part of the same stress-response pathway.

attention:
  name: attention
  description: Cognitive attention profile for task-driven dynamics and adaptive control.
  analysis_question: Does the monitored signal show tighter predictive precision when attention is engaged by the task, or reduced top-down control?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  expected_columns:
    - signal
    - condition
    - trial
  signal_roles:
    primary_signal: Main cognitive or neural signal associated with attentional state.
    condition: Task phase, condition, or experimental state used for comparison.
    covariate: Optional trial-level, session-level, or participant metadata.
  interpretation_rules:
    sample_entropy: Attention can be framed as precision-weighting of expected sensory or task-relevant signals (Friston, 2010; Clark, 2013; Hohwy, 2013); reduced entropy when attention is engaged is consistent with tighter predictive precision around the task, while elevated entropy may reflect divided attention or reduced top-down control rather than richer processing.
    spectral_entropy: A shift toward broader frequency engagement when attention is recruited is consistent with multiple task-relevant processes being active concurrently (Rumelhart et al., 1986); a narrower spectrum can indicate a single dominant rhythm capturing the bulk of signal energy.
    dfa_exponent: Changes in long-range temporal correlation during attentional engagement point to shifts in how strongly past states constrain present ones (Hopfield, 1982); stronger persistence is consistent with sustained, attractor-like engagement, while a drop toward random-walk-like behavior (~0.5) suggests more moment-to-moment reactivity.
    mutual_information: Under a predictive-processing account, attention coordinates precision-weighting across signals (Friston, 2010); increased mutual information when attention is engaged is consistent with shared top-down control linking the signals, while decreased coupling suggests they are being processed more independently.

heart_rate_variability:
  name: heart_rate_variability
  description: Beat-to-beat heart rate (RR or NN interval) dynamics, focused on regularity and fractal scaling as markers of healthy cardiovascular regulation.
  analysis_question: Does beat-to-beat heart rate keep the irregular, fractal-like fluctuation of healthy cardiac regulation, or does it lose complexity, as reported with aging and disease?
  recommended_metrics:
    - sample_entropy
    - dfa_short_term
    - dfa_long_term
  expected_columns:
    - rr_interval
    - condition
    - subject_id
  signal_roles:
    primary_signal: Interbeat (RR or NN) interval series, one value per heartbeat, with intervals next to ectopic beats or detection artifacts removed.
    condition: Group or state being compared, such as young vs elderly or rest vs tilt.
    covariate: Optional metadata such as age, sex, medication, or recording session.
  interpretation_rules:
    sample_entropy: Healthy heart rate is irregular from beat to beat; lower sample entropy (Richman & Moorman, 2000) means more regular, predictable dynamics. Reduced heart-rate entropy has been reported with aging (Kaplan et al., 1991), in line with the view that aging and disease bring a loss of physiological complexity (Lipsitz & Goldberger, 1992). Sample entropy depends on its tolerance r and on series length, so only compare values computed with the same settings.
    dfa_short_term: Short-range DFA exponent over windows of 4-16 beats, the range used for heart-rate DFA (Peng et al., 1995). Healthy elderly subjects show a higher short-range exponent than young subjects (Iyengar et al., 1996), meaning smoother, more random-walk-like fluctuation over a few beats, consistent with a single dominant regulatory time scale replacing the multi-scale control of the young heart.
    dfa_long_term: Long-range DFA exponent over windows of 16-64 beats (Peng et al., 1995). Values near 1.0 indicate the 1/f-like fractal scaling of healthy heart rate, and a drop toward 0.5 indicates a loss of long-range correlation, which has been reported in healthy elderly subjects (Iyengar et al., 1996). That study's long-range exponent may span a wider window than 16-64 beats, so compare directions rather than absolute values.

climate_temperature:
  name: climate_temperature
  description: Daily surface air temperature records, focused on long-range persistence -- how strongly a warm or cold anomaly carries over into the following weeks, months, and years.
  analysis_question: Do daily temperature anomalies show long-range power-law persistence, and is it stronger where the ocean's heat capacity couples into the atmosphere (islands) than over the continents?
  recommended_metrics:
    - dfa_exponent
  metric_parameters:
    # Windows in days, starting well above the ~10-day weather-regime crossover and ending
    # where the shortest records still hold four windows. DFA2 removes linear trends in the
    # anomalies, such as urban warming, which would otherwise inflate the exponent.
    dfa_exponent:
      min_scale: 30
      max_scale: 3000
      order: 2
  # Records have gaps from a day to over a decade. They're joined (the default gap_policy):
  # temperature anomalies are positively correlated, and joining vs. segment-aware DFA
  # agreed within ~0.01 per station (docs/validation/gap_handling.md).
  expected_columns:
    - tmax_anomaly
    - condition
    - station_id
  signal_roles:
    primary_signal: Deseasonalized daily temperature (degrees C), one value per day, with the mean annual cycle removed by subtracting each calendar date's long-term mean.
    condition: Station group being compared, such as island vs continental, or climate zone.
    covariate: Optional station metadata such as setting (inland, coastal, island), elevation, or record length.
  interpretation_rules:
    dfa_exponent: DFA fluctuation exponent of temperature anomalies over windows of about a month to several years. An exponent of 0.5 means anomalies are uncorrelated beyond the weather time scale, and a higher one means power-law persistence, with correlations decaying as s^-gamma where gamma = 2 - 2*alpha. Continental and coastal stations show alpha close to 0.65 almost everywhere (Koscielny-Bunde et al., 1998; Eichner et al., 2003), while island stations range from 0.65 to 0.85 and average about 0.8, which is attributed to coupling with the slowly varying ocean (Eichner et al., 2003). Some analyses find inner-continental records closer to 0.5 (Fraedrich & Blender, 2003), so compare continental values against both. DFA order matters when records contain trends, so only compare exponents computed with the same order and window range.

network:
  name: network
  description: Network-science analysis of graph-structured data, focused on small-world structure, community organization, and connectivity.
  analysis_question: Does the network show small-world organization, distinct community structure, or scale-free connectivity, and how does that structure shift between conditions?
  recommended_metrics:
    - density
    - mean_degree
    - avg_clustering
    - transitivity
    - modularity
    - avg_shortest_path_length
  expected_columns:
    - source
    - target
    - condition
  signal_roles:
    source: One endpoint of each edge (a node identifier).
    target: The other endpoint of each edge (a node identifier).
    weight: Optional edge weight; used for clustering and modularity, but not for shortest-path distance.
    condition: Experimental or task condition used to compare network structure across states.
  interpretation_rules:
    avg_clustering: High average clustering means a node's neighbors tend to also be connected to each other, forming locally dense neighborhoods; this is one of the two defining ingredients of small-world structure (Watts & Strogatz, 1998).
    avg_shortest_path_length: A short average path length despite high clustering is the hallmark of small-world structure (Watts & Strogatz, 1998), combining locally dense neighborhoods with efficient global reach. A short path length alongside low clustering instead suggests a more random or centralized structure rather than a small-world one.
    transitivity: Transitivity is the network-wide version of clustering (the fraction of connected triples that close into a triangle); comparing it against average clustering shows whether local density is spread evenly or concentrated in a few well-connected nodes (Newman, 2010).
    modularity: High modularity indicates the network decomposes into distinct communities with denser connections inside each community than between them (Newman, 2010), consistent with functional specialization or subgroup structure; low modularity suggests a more globally integrated network without clear subgroup boundaries.
    density: Density is the fraction of all possible edges that are actually present; sparse, structured networks with high clustering are more consistent with small-world or scale-free organization than with a dense, unstructured network (Barabási & Albert, 1999).
    mean_degree: A network dominated by a few very high-degree hub nodes rather than a roughly uniform degree is the signature of scale-free, preferential-attachment growth (Barabási & Albert, 1999) rather than a random or regular network; this summary reports the mean only, so check the degree-distribution plot for whether a few hubs dominate.
    small_world_sigma: Sigma directly formalizes the Watts-Strogatz small-world criterion (Watts & Strogatz, 1998; Humphries & Gurney, 2008) by comparing clustering and path length against matched random reference graphs; sigma greater than 1 indicates small-world structure (elevated clustering without a proportional cost in path length), while sigma at or below 1 indicates the network is no more clustered than a comparable random graph.
    small_world_omega: Omega compares the network against both a random and a lattice reference simultaneously (Telesford et al., 2011); values near 0 indicate small-world structure, negative values indicate the network is more lattice-like (highly clustered but with long paths), and positive values indicate the network is more random-like.

social_network:
  name: social_network
  description: Social networks of people or organizations (friendship, collaboration, communication), focused on cohesive subgroups, triadic closure, and how quickly anyone can reach anyone else.
  analysis_question: Does the network split into cohesive subgroups, are friends of friends connected (triadic closure), and is it a small world in which a few bridging ties link otherwise separate groups?
  recommended_metrics:
    - n_nodes
    - n_edges
    - mean_degree
    - density
    - avg_clustering
    - transitivity
    - modularity
    - avg_shortest_path_length
    - n_connected_components
  expected_columns:
    - source
    - target
  signal_roles:
    source: One person or organization in a tie.
    target: The other person or organization in the tie (for directed data such as messages, the recipient).
    weight: Optional tie strength, such as interaction count or number of joint papers; used for clustering and modularity, not for path length.
    condition: Optional label for comparing networks, such as two time periods, groups, or communities.
  interpretation_rules:
    n_nodes: Number of people or organizations with at least one tie; isolates aren't in an edge list, so they are never counted.
    n_edges: Number of distinct ties. Many social datasets record repeated interactions; those collapse into one tie unless a weight column keeps their count.
    mean_degree: Average number of ties per person. Social networks are usually sparse, with a few people holding far more ties than average, so check the degree-distribution plot rather than reading the mean as typical.
    density: Fraction of all possible ties that exist. It falls as a network grows, since each person can only maintain so many ties, so compare density only between networks of similar size.
    avg_clustering: How often two of a person's contacts also know each other. High clustering reflects triadic closure, in which strong ties to a shared contact make a tie between the two likely (Granovetter, 1973). Collaboration networks are far more clustered than random networks of the same size and density (Newman, 2001).
    transitivity: Network-wide share of connected triples that close into triangles. When it is well below average clustering, low-degree people sit in tight groups while high-degree people span groups whose members don't know each other.
    modularity: How cleanly the network divides into cohesive subgroups, with dense ties inside each and few between. Social communities often follow real divisions; in Zachary's karate club they matched the factions the club later split into (Zachary, 1977; Girvan & Newman, 2002). High modularity can mean homophily, since people tie to similar others (McPherson et al., 2001), or segregation, or simply separate settings such as departments. It does not say which attribute drives the division. The few ties between communities tend to be weak ties, which carry new information between groups (Granovetter, 1973), and the people holding them broker across structural holes (Burt, 1992); run with --compute-centrality and look for high betweenness to find them.
    avg_shortest_path_length: Average number of steps between two people in the largest connected component. Short paths despite high clustering make a small world (Milgram, 1967; Watts & Strogatz, 1998), and collaboration networks have paths about as short as random networks of the same size (Newman, 2001).
    n_connected_components: Number of separate pieces. Real social networks usually have one giant component plus many small groups that never connect to it, such as authors who only wrote with each other. Path length covers the giant component only.
    small_world_sigma: Sigma compares clustering and path length against random networks with the same degrees (Humphries & Gurney, 2008); above 1 means small-world structure. It needs a fully connected network, so it is NaN for most real social networks unless the giant component is analyzed on its own.
    small_world_omega: Omega compares the network with both a random and a lattice reference (Telesford et al., 2011); near 0 means small-world, negative lattice-like, positive random-like. Like sigma, it needs a fully connected network.


# --- Profiles for data exported by behavetrack (video and microscope tracking) ---------------
# `behavetrack export-complexity` writes files in exactly these shapes; see that project's README.

collective_behavior:
  name: collective_behavior
  description: Coordinated movement of animal groups (flocks, schools, swarms, crowds) or migrating cells, tracked in video, described frame by frame by how aligned, circling, fast and tightly packed the group is.
  analysis_question: Does the group's coordination fluctuate like memoryless noise around one state, or does it show structure such as long bouts of alignment and switches between collective states, and does that differ between conditions?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  expected_columns:
    - polarization
    - condition
    - session
  signal_roles:
    primary_signal: A group-level value per video frame from behavetrack's frames.csv. polarization (0 to 1, how aligned the headings are), rotation (0 to 1, how much the group circles its centre), mean_speed_bl_s, and nn_dist_bl or spread_bl (spacing in body lengths).
    condition: Group or treatment being compared, such as species, group size, temperature, or before and after a disturbance.
    covariate: session identifies each video, one recording each. n_visible is the number of tracked individuals in the frame.
  interpretation_rules:
    sample_entropy: Polarization and rotation are the order parameters of collective motion, near 1 when the group moves in one direction or circles a shared centre and near 0 when it swarms without order (Vicsek et al., 1995; Couzin et al., 2002). Low sample entropy means these values change in regular, repeatable ways, as in a group that holds one state or turns on a steady cycle. High sample entropy means irregular change, as when a group switches unpredictably between swarming, milling and schooling, which schooling fish do on their own (Tunstrøm et al., 2013). Tracking errors such as identity swaps and merged animals add frame-to-frame noise that raises entropy, so only compare videos tracked with the same settings.
    spectral_entropy: Low spectral entropy means coordination rises and falls mainly at one rhythm, such as regular turns, repeated splitting and rejoining, or a periodic disturbance. High spectral entropy means fluctuation spread across many time scales. The frame rate sets the fastest rhythm that can be seen, so compare videos recorded at the same rate.
    dfa_exponent: Near 0.5, departures from the group's typical coordination are short-lived and memoryless. Above 0.5 they persist, so an ordered or disordered bout tends to continue, as expected in groups that settle into one collective state for a while before switching (Tunstrøm et al., 2013). Flocks also show correlations that span the whole group in space (Cavagna et al., 2010), a sign of being close to a transition between order and disorder. Persistence in time is a related but separate property, so a high exponent is consistent with such organization rather than proof of it. Windows are counted in video frames, so the time scale the exponent describes depends on the frame rate.
    mutual_information: Coupling between two group signals, such as speed and polarization. Schooling fish swarm when they move slowly and form either a milling or a polarized school as they speed up (Tunstrøm et al., 2013), so speed and polarization usually share information. Weaker coupling under a condition suggests the group's order is being set by something other than speed, such as an obstacle, a predator or a change in group size.

neural_activity:
  name: neural_activity
  description: Activity of individual neurons in calcium (or voltage) imaging movies, as Delta F/F, the change in each neuron's fluorescence relative to its resting level, frame by frame (behavetrack neurons mode).
  analysis_question: Is each neuron's activity irregular and memoryless, or structured over long time scales, as when neurons take part in recurrent network activity, and does a condition such as a drug, developmental stage or stimulation change that?
  recommended_metrics:
    - sample_entropy
    - spectral_entropy
    - dfa_exponent
  metric_parameters:
    # Windows are in frames. 16 frames stays above the decay of a calcium transient at
    # typical imaging rates (about 0.5 to 1.5 s at 10 to 30 frames per second); raise it
    # for faster imaging or slower indicators.
    dfa_exponent:
      min_scale: 16
  expected_columns:
    - dff
    - condition
    - session
    - neuron_id
  signal_roles:
    primary_signal: Delta F/F of one neuron per frame (behavetrack's traces_dff.csv, reshaped to one row per neuron per frame).
    condition: Treatment or state being compared, such as control and drug, or days in culture.
    covariate: session (the movie) and neuron_id together identify one recording. Run with --unit-cols session,neuron_id so metrics are computed per neuron, then averaged per condition.
  interpretation_rules:
    sample_entropy: Delta F/F is a slowed, smoothed view of spiking, since each spike produces a calcium transient that rises quickly and decays over a fraction of a second to a few seconds, depending on the indicator (Chen et al., 2013). That smoothing makes neighbouring frames alike and lowers sample entropy, so only compare recordings made with the same indicator and frame rate. Within such a comparison, lower entropy means more stereotyped activity, such as regular firing or firing locked to network bursts, and higher entropy means more irregular, independent firing.
    spectral_entropy: Low spectral entropy means activity is concentrated at one rhythm, such as periodic network bursts, which are common in cultured networks. High spectral entropy means activity spread across time scales. Indicator kinetics filter out fast rhythms (Chen et al., 2013), so the spectrum describes slow structure only.
    dfa_exponent: Near 0.5 means fluctuations are uncorrelated beyond the indicator's own time scale. Above 0.5 means long-range temporal correlations, which have been found in the amplitude of human brain oscillations (Linkenkaer-Hansen et al., 2001) and are often linked with networks working near criticality, where activity spreads in cascades of all sizes (Beggs & Plenz, 2003). Slow drift or bleaching that Delta F/F did not remove also raises the exponent, so check traces for slow trends before reading a high value as network structure.
    mutual_information: Computed only when more than one signal is analyzed, for example a neuron's Delta F/F together with a population signal such as the fraction of neurons firing. High coupling means a neuron's activity is largely explained by population events, low coupling that it fires more on its own.

animal_social_network:
  name: animal_social_network
  description: Networks of which tracked individuals come close to which (animals, people or cells in one video), from behavetrack's interactions.csv. Each tie joins two individuals that came within the contact distance, weighted by their total time in contact.
  analysis_question: Are contacts spread evenly through the group, or concentrated in subgroups and a few central individuals, and does that structure change between conditions?
  recommended_metrics:
    - n_nodes
    - n_edges
    - mean_degree
    - density
    - avg_clustering
    - transitivity
    - modularity
    - avg_shortest_path_length
    - n_connected_components
  expected_columns:
    - source
    - target
    - weight
  signal_roles:
    source: Track ID of one individual in a contact.
    target: Track ID of the other individual.
    weight: Total seconds the pair spent within the contact distance; used for clustering and modularity, not for path length.
    condition: Optional label for comparing groups or treatments, such as two arenas or before and after a change.
  interpretation_rules:
    n_nodes: Number of tracked individuals with at least one contact. Video tracking gives an individual a new ID each time it is lost and found again, so n_nodes can exceed the number of animals, and one animal's contacts can be split across several nodes. Compare n_nodes with the tracker's typical count before reading individual-level results.
    n_edges: Number of pairs that came into contact at least once. Repeated contacts collapse into one tie, whose weight is their total contact time.
    mean_degree: Average number of different partners per individual. In a confined arena partners accumulate with time, so compare recordings of similar length.
    density: Share of all possible pairs that met. Proximity networks fill in quickly in small arenas and long recordings, where nearly everyone meets everyone, so low density in such a setting points to avoidance or stable subgroups.
    avg_clustering: How often two partners of the same individual are also partners of each other. Animal groups often show clustered association (Krause et al., 2007; Wey et al., 2008), but crowding alone also produces clustering in proximity networks, so compare against randomized networks before reading it as social preference (Farine & Whitehead, 2015).
    transitivity: Network-wide share of connected triples that close into triangles. When it is well below average clustering, low-degree individuals sit in tight groups while a few high-degree individuals span groups that otherwise don't meet.
    modularity: How cleanly the group divides into subgroups with more contact inside than between. Wild animal societies can have distinct communities joined by a few individuals who act as brokers between them, as in a population of bottlenose dolphins (Lusseau & Newman, 2004). In a single arena, high modularity can also come from animals sorting by position or from a short recording, so test it against permuted networks (Farine & Whitehead, 2015).
    avg_shortest_path_length: Average number of contact steps between two individuals in the largest connected group, which bears on how quickly information or infection could pass through it (Krause et al., 2007).
    n_connected_components: More than one component means some individuals never contacted the rest. With video tracking this is often an identity fragment that was seen only briefly.
    small_world_sigma: Sigma compares clustering and path length against random networks with the same degrees (Humphries & Gurney, 2008); above 1 means small-world structure. It needs a fully connected network, so drop brief identity fragments first.
    small_world_omega: Omega compares the network with both a random and a lattice reference (Telesford et al., 2011); near 0 means small-world, negative lattice-like, positive random-like.

neuronal_network:
  name: neuronal_network
  description: Functional networks of imaged neurons, from behavetrack's correlations.csv. Each tie joins two neurons whose Delta F/F activity is correlated above a threshold, weighted by the correlation.
  analysis_question: Is coordinated activity spread across the whole population or organized into modules and hub neurons, and does the organization change with development or treatment?
  recommended_metrics:
    - n_nodes
    - n_edges
    - mean_degree
    - density
    - avg_clustering
    - transitivity
    - modularity
    - avg_shortest_path_length
    - n_connected_components
  expected_columns:
    - source
    - target
    - weight
  signal_roles:
    source: ID of one neuron.
    target: ID of the other neuron.
    weight: Correlation between the two neurons' Delta F/F traces (only pairs above the export threshold are included).
    condition: Optional label for comparing recordings, such as control and drug, or days in culture.
  interpretation_rules:
    n_nodes: Number of neurons with at least one correlation above the threshold. Neurons that never fire, or fire independently, drop out of the network entirely.
    n_edges: Number of neuron pairs correlated above the threshold. The threshold is a choice, and almost every network measure changes with it.
    mean_degree: Average number of neurons each neuron is correlated with. Because degree, clustering and path length all depend on how many ties there are, compare networks at the same density or the same mean degree rather than the same threshold (van Wijk et al., 2010).
    density: Share of all neuron pairs that are correlated above the threshold. Population-wide network bursts make nearly every pair correlated, which pushes density toward 1 and hides finer structure, so compare recordings with similar burst rates or analyze activity outside bursts.
    avg_clustering: How often two neurons correlated with the same neuron are also correlated with each other. High clustering with short paths is the small-world pattern found across many brain networks (Bullmore & Sporns, 2009; Watts & Strogatz, 1998). Correlation is not connection, since shared input makes two neurons correlate without a synapse between them (Rubinov & Sporns, 2010).
    transitivity: Network-wide share of connected triples that close into triangles, read alongside average clustering. Correlation networks are inherently rich in triangles, because if A tracks B and B tracks C, A tends to track C.
    modularity: How cleanly the population divides into groups of neurons that are active together more than with the rest. Modules suggest separate assemblies or regions of the dish, and their boundaries are worth checking against neuron positions (distance_um in correlations.csv).
    avg_shortest_path_length: Average number of correlation steps between two neurons in the largest connected group. Short paths mean activity in one part of the network is closely tied to the rest.
    n_connected_components: Separate groups of neurons whose activity is unrelated to the others at this threshold.
    small_world_sigma: Sigma compares clustering and path length against random networks with the same degrees (Humphries & Gurney, 2008); above 1 means small-world structure, as reported for many brain networks (Bullmore & Sporns, 2009). It needs a fully connected network.
    small_world_omega: Omega compares the network with both a random and a lattice reference (Telesford et al., 2011); near 0 means small-world, negative lattice-like, positive random-like. Hub neurons that coordinate synchrony, found in the developing hippocampus (Bonifazi et al., 2009), are best found per neuron with --compute-centrality rather than from these network-wide summaries.
